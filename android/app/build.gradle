apply plugin: 'com.android.application'

android {
    namespace = "com.cbmenes.pathconnect"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cbmenes.pathconnect"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // Store the web client uncompressed. Compressed assets can fail to
            // open through the WebView asset loader, so the stylesheet never
            // reaches the page and the board paints without its grid.
            noCompress 'html', 'js', 'css', 'json', 'svg', 'wasm', 'woff', 'woff2', 'ttf', 'otf', 'map', 'webmanifest'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The page must load the same board stylesheet the live site renders. A missing
// file, a rewritten WebView stylesheet, or a link that does not point at a
// packaged file leaves the grid unstyled.
tasks.register('verifyNativeWebAssets') {
    def publicDir = file('src/main/assets/public')
    doLast {
        def fix = "Run `npm run cap:sync` from the project root, then rebuild."
        def index = new File(publicDir, 'index.html')
        if (!index.isFile()) {
            throw new GradleException("Path Connect web assets are missing from ${publicDir}. ${fix}")
        }
        def html = index.getText('UTF-8')
        def at = html.indexOf('/assets/')
        def end = at < 0 ? -1 : html.indexOf('.css', at)
        if (at < 0 || end < 0) {
            throw new GradleException("Path Connect index.html does not link its board stylesheet. ${fix}")
        }
        def linked = html.substring(at + 1, end + 4)
        def cssFile = new File(publicDir, linked)
        if (!cssFile.isFile()) {
            throw new GradleException("Path Connect index.html loads /${linked}, but that file is not in the Android package. ${fix}")
        }
        def css = cssFile.text
        if (!css.contains('.pc-board') || !css.contains('--pc-cols') || !css.contains('aspect-ratio:1')) {
            throw new GradleException("Path Connect stylesheet in the Android package is missing the live board grid. ${fix}")
        }
        if (css.contains('.pc-legacy-colors')) {
            throw new GradleException("Path Connect Android package has the rewritten WebView stylesheet instead of the live board CSS. ${fix}")
        }
    }
}
preBuild.dependsOn verifyNativeWebAssets

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
